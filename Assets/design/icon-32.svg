<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Hand-tuned 32 px grid version (also used for 24 and 20 px). Bolder shapes, no fine detail. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22417A"/>
      <stop offset="1" stop-color="#0B1834"/>
    </linearGradient>
    <linearGradient id="bell" x1="7" y1="0" x2="25" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6FD3FA"/>
      <stop offset="0.3" stop-color="#A6EBFF"/>
      <stop offset="0.6" stop-color="#43AEEC"/>
      <stop offset="1" stop-color="#1A6DBA"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#F0A21A"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="6.5" fill="none" stroke="#8FD6FF" stroke-opacity="0.35"/>
  <!-- waves -->
  <g fill="none" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round">
    <path d="M7 8.5 Q4.8 11.5 5.6 15.5"/>
    <path d="M25 8.5 Q27.2 11.5 26.4 15.5"/>
  </g>
  <!-- bell -->
  <rect x="15" y="4" width="2" height="3" rx="1" fill="#2A8AD6"/>
  <path d="M16 6 C12.4 6 10.4 8.4 10 11.6 L9.5 16.4 C9.3 18.4 8.5 19.6 7.3 20.6 L7 22 H25 L24.7 20.6 C23.5 19.6 22.7 18.4 22.5 16.4 L22 11.6 C21.6 8.4 19.6 6 16 6 Z" fill="url(#bell)"/>
  <path d="M12.4 9 C11.6 10 11.3 11.2 11.1 12.6 L10.7 16" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1" stroke-linecap="round"/>
  <rect x="6" y="21" width="20" height="3" rx="1.5" fill="#1C70BE"/>
  <circle cx="16" cy="26.5" r="2.6" fill="url(#gold)"/>
</svg>
