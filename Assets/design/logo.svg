<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- LAN Doorbell Pro: master artwork (used for the logo and the 40–256 px icon sizes). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22417A"/>
      <stop offset="0.55" stop-color="#132A55"/>
      <stop offset="1" stop-color="#0A1631"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tileEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FDcFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#9FDCFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="470" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3DB8F5" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#2A7FD0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2A7FD0" stop-opacity="0"/>
    </radialGradient>

    <!-- Bell: lit from the upper left, like polished enamel -->
    <linearGradient id="bell" x1="290" y1="0" x2="734" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FC3F7"/>
      <stop offset="0.28" stop-color="#9BE6FF"/>
      <stop offset="0.52" stop-color="#4DB7EF"/>
      <stop offset="0.82" stop-color="#2385D2"/>
      <stop offset="1" stop-color="#1663AE"/>
    </linearGradient>
    <linearGradient id="bellShade" x1="0" y1="262" x2="0" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B3C78" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#0B3C78" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0B3C78" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="664" x2="0" y2="714" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3FA6E6"/>
      <stop offset="0.5" stop-color="#1E78C6"/>
      <stop offset="1" stop-color="#11508F"/>
    </linearGradient>
    <linearGradient id="rimSide" x1="268" y1="0" x2="756" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="300" x2="0" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Gold for the clapper, sound waves and the centre node -->
    <radialGradient id="gold" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFF6C4"/>
      <stop offset="0.35" stop-color="#FFD75E"/>
      <stop offset="0.75" stop-color="#F2A81E"/>
      <stop offset="1" stop-color="#B9790B"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE07A"/>
      <stop offset="1" stop-color="#F3AE24"/>
    </linearGradient>

    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
    <filter id="bellShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#030B1F" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="waveGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <path id="bellBody" d="M512 262
      C436 262 378 312 366 404 L350 520
      C342 578 322 616 290 646 C276 659 284 680 304 680
      L720 680 C740 680 748 659 734 646
      C702 616 682 578 674 520 L658 404
      C646 312 588 262 512 262 Z"/>
  </defs>

  <!-- Tile -->
  <g filter="url(#tileShadow)">
    <rect x="72" y="72" width="880" height="880" rx="200" fill="url(#tile)"/>
  </g>
  <rect x="72" y="72" width="880" height="880" rx="200" fill="url(#glow)"/>
  <rect x="72" y="72" width="880" height="880" rx="200" fill="url(#gloss)"/>
  <rect x="76" y="76" width="872" height="872" rx="196" fill="none" stroke="url(#tileEdge)" stroke-width="6"/>

  <g transform="translate(0 -40)">
    <!-- Sound waves -->
    <g fill="none" stroke="url(#wave)" stroke-linecap="round" filter="url(#waveGlow)">
      <path d="M286 316 Q232 386 250 476" stroke-width="28"/>
      <path d="M738 316 Q792 386 774 476" stroke-width="28"/>
      <path d="M210 262 Q138 384 166 520" stroke-width="26" stroke-opacity="0.55"/>
      <path d="M814 262 Q886 384 858 520" stroke-width="26" stroke-opacity="0.55"/>
    </g>

    <!-- LAN: the clapper is wired to the network -->
    <g stroke="#5ED0FF" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.95">
      <path d="M512 800 V860"/>
      <path d="M352 860 H672"/>
    </g>
    <circle cx="332" cy="860" r="22" fill="#0E2049" stroke="#5ED0FF" stroke-width="11"/>
    <circle cx="692" cy="860" r="22" fill="#0E2049" stroke="#5ED0FF" stroke-width="11"/>
    <circle cx="512" cy="860" r="20" fill="url(#gold)" stroke="#FFE38A" stroke-width="4"/>

    <!-- Bell -->
    <g filter="url(#bellShadow)">
      <!-- crown / hanging loop -->
      <rect x="486" y="216" width="52" height="62" rx="26" fill="url(#rim)"/>
      <rect x="498" y="226" width="12" height="34" rx="6" fill="#FFFFFF" fill-opacity="0.35"/>
      <use href="#bellBody" fill="url(#bell)"/>
      <use href="#bellBody" fill="url(#bellShade)"/>
      <!-- decorative band near the shoulder -->
      <path d="M371 392 Q512 372 653 392" fill="none" stroke="#1A6CB8" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round"/>
      <path d="M369 404 Q512 384 655 404" fill="none" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="4" stroke-linecap="round"/>
      <!-- lip -->
      <rect x="268" y="664" width="488" height="50" rx="25" fill="url(#rim)"/>
      <rect x="268" y="664" width="488" height="50" rx="25" fill="url(#rimSide)"/>
      <path d="M298 672 H726" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>
      <!-- clapper stem and clapper -->
      <rect x="503" y="712" width="18" height="24" rx="6" fill="#0E4A8C"/>
      <circle cx="512" cy="756" r="46" fill="url(#gold)"/>
      <ellipse cx="497" cy="740" rx="15" ry="10" fill="#FFFFFF" fill-opacity="0.75" filter="url(#soft)"/>
    </g>

    <!-- specular highlights on the bell -->
    <path d="M432 316 C404 340 392 382 386 424 L372 540 C368 576 360 604 344 628
             C366 614 382 588 390 556 L406 432 C412 386 420 348 432 316 Z"
          fill="url(#highlight)" filter="url(#soft)"/>
    <ellipse cx="468" cy="312" rx="26" ry="12" transform="rotate(-24 468 312)" fill="#FFFFFF" fill-opacity="0.7" filter="url(#soft)"/>
  </g>
</svg>
