  <rect x="7" y="1" width="2" height="2" fill="#3A9BE2"/>
  <path d="M8 2 C6 2 5 3.4 5 5 V8 C5 9.2 4.4 10 3 10.5 V12 H13 V10.5 C11.6 10 11 9.2 11 8 V5 C11 3.4 10 2 8 2 Z" fill="#7FD8FF"/>
  <rect x="10" y="4" width="1" height="6" fill="#3FA8EC"/>
  <rect x="6" y="4" width="1" height="4" fill="#C9F2FF"/>
  <rect x="3" y="11" width="10" height="1" fill="#2C8FD8"/>
